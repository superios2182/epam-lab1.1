AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS CloudFormation Lab 3.1 - Modern & Fast WordPress on Amazon Linux 2'

Parameters:
  KeyName:
    Description: Name of an existing EC2 KeyPair to enable SSH access to the Amazon EC2 instance
    Type: AWS::EC2::KeyPair::KeyName
    Default: vockey
  DBUser:
    Description: WordPress database admin account username
    Type: String
    Default: admin
  DBPassword:
    Description: WordPress database admin account password
    Type: String
    NoEcho: 'true'
  DBRootPassword:
    Description: Database admin root password
    Type: String
    NoEcho: 'true'
  InstanceType:
    Description: WebServer EC2 instance type
    Type: String
    Default: t2.micro
  # Динамический поиск самого актуального образа Amazon Linux 2
  LatestAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2'

Resources:
  WebServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Enable HTTP access via port 80 and SSH access via port 22
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0

  WebServer:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      SecurityGroups:
        - !Ref WebServerSecurityGroup
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # Обновляем систему и подключаем PHP 8.2
          yum update -y
          amazon-linux-extras enable php8.2 -y
          yum clean metadata
          
          # Устанавливаем Apache, PHP, расширения и MariaDB (замена MySQL)
          yum install -y httpd mariadb-server php php-mysqlnd php-gd php-xml php-mbstring wget
          
          # Запускаем и включаем службы
          systemctl start httpd
          systemctl enable httpd
          systemctl start mariadb
          systemctl enable mariadb

          # Настраиваем безопасные пароли для базы данных
          mysqladmin -u root password '${DBRootPassword}'
          mysql -u root -p'${DBRootPassword}' -e "CREATE DATABASE wordpress; CREATE USER '${DBUser}'@'localhost' IDENTIFIED BY '${DBPassword}'; GRANT ALL PRIVILEGES ON wordpress.* TO '${DBUser}'@'localhost'; FLUSH PRIVILEGES;"

          # Скачиваем и распаковываем WordPress
          cd /var/www/html
          wget https://wordpress.org/latest.tar.gz
          tar -xzf latest.tar.gz
          cp -r wordpress/* .
          rm -rf wordpress latest.tar.gz

          # Создаем файл конфигурации wp-config.php
          cp wp-config-sample.php wp-config.php
          sed -i "s/database_name_here/wordpress/g" wp-config.php
          sed -i "s/username_here/${DBUser}/g" wp-config.php
          sed -i "s/password_here/${DBPassword}/g" wp-config.php

          # Выставляем правильные права доступа для веб-сервера Apache
          chown -R apache:apache /var/www/html
          chmod -R 755 /var/www/html
          systemctl restart httpd

Outputs:
  WebsiteURL:
    Value: !Sub 'http://${WebServer.PublicDnsName}'
    Description: WordPress Website URL
